<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna (máx. 520px), cabecera compacta, contenido con scroll y barra de pestañas fija abajo */
:root {
  --bg: #FBF6F5;
  --surface: #FFFFFF;
  --surface-2: #F5ECEA;
  --fg: #241A1F;
  --muted: #76666C;
  --line: #EADDDA;
  --accent: #E2475F;
  --accent-fg: #FFFFFF;
  --accent-soft: #FCE3E7;
  --teal: #0F7A73;
  --teal-soft: #DDF1EE;
  --warn: #B4610B;
  --warn-soft: #FBEBD6;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --radius: 18px;
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171215; --surface: #221B1F; --surface-2: #2C2328; --fg: #F6ECEE; --muted: #B3A1A7;
    --line: #3A2F35; --accent: #FF6B80; --accent-fg: #2A0A11; --accent-soft: #46202A;
    --teal: #4FC9BE; --teal-soft: #173430; --warn: #F2A54A; --warn-soft: #3A2A16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171215; --surface: #221B1F; --surface-2: #2C2328; --fg: #F6ECEE; --muted: #B3A1A7;
  --line: #3A2F35; --accent: #FF6B80; --accent-fg: #2A0A11; --accent-soft: #46202A;
  --teal: #4FC9BE; --teal-soft: #173430; --warn: #F2A54A; --warn-soft: #3A2A16;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 400 16px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.12; text-wrap: balance; margin: 0; }
p { margin: 0; }

.app {
  max-width: 520px; margin: 0 auto;
  padding-inline: 16px;
  padding-block: 12px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
}
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 8px 16px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand b { font: 800 24px/1 var(--display); letter-spacing: -0.02em; }
.streak {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.streak svg { width: 16px; height: 16px; color: var(--accent); }

.view { display: grid; gap: 16px; animation: rise .28s ease-out; }
@keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .view, .card-phrase { animation: none !important; } }

.eyebrow {
  font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.h-xl { font-size: clamp(28px, 8vw, 36px); font-weight: 800; letter-spacing: -0.025em; }
.h-l { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.sub { color: var(--muted); }

.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; display: grid; gap: 12px; min-width: 0;
}
.hero {
  background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 24px;
  padding: 22px 20px; display: grid; gap: 14px; position: relative; overflow: hidden;
}
.hero .eyebrow { color: inherit; opacity: .85; }
.hero p.big { font: 700 clamp(21px, 6vw, 26px)/1.25 var(--display); letter-spacing: -0.01em; }
.hero::after {
  content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px;
  border-radius: 50%; border: 18px solid currentColor; opacity: .09; pointer-events: none;
}

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 10px 16px; font-weight: 600; font-size: 15px; min-height: 44px;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.ghost-on-accent { background: transparent; border-color: currentColor; color: inherit; }
.btn.solid-on-accent { background: var(--accent-fg); color: var(--accent); border-color: transparent; }
.btn.icon { padding: 10px; width: 44px; }
.btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.btn.grow { flex: 1 1 auto; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 8px 14px; font-size: 14px; font-weight: 600; color: var(--muted); min-height: 38px;
}
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.card-phrase {
  background: var(--surface); border: 1px solid var(--line); border-radius: 24px;
  padding: 24px 20px 18px; display: grid; gap: 18px; min-height: 230px; align-content: space-between;
  animation: rise .25s ease-out;
}
.card-phrase .quote { font: 700 clamp(22px, 6.4vw, 27px)/1.28 var(--display); letter-spacing: -0.01em; }
.card-phrase .why { color: var(--muted); font-size: 14px; border-top: 1px dashed var(--line); padding-top: 12px; }
.counter { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.list { display: grid; gap: 10px; }
.item {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px;
  display: grid; gap: 6px; min-width: 0;
}
.item h3 { font-size: 17px; font-weight: 700; }
.item p { color: var(--muted); font-size: 15px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.tag.t-teal { background: var(--teal-soft); color: var(--teal); }
.tag.t-accent { background: var(--accent-soft); color: var(--accent); }

.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 8px 6px; font-weight: 600; font-size: 14px; color: var(--muted); min-height: 38px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.field-label { font-size: 13px; font-weight: 700; color: var(--muted); }

textarea {
  width: 100%; min-height: 150px; resize: vertical; border: 1px solid var(--line); border-radius: 14px;
  background: var(--bg); padding: 12px 14px; line-height: 1.5; font-size: 16px;
}
textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }

.score { display: flex; align-items: center; gap: 16px; }
.dial { width: 84px; height: 84px; flex: none; }
.dial .trk { stroke: var(--surface-2); }
.dial .val { stroke: var(--accent); transition: stroke-dashoffset .5s ease; }
.dial text { fill: var(--fg); font: 800 26px var(--display); }
.dial text.of { fill: var(--muted); font: 600 11px var(--body); }
.verdict h3 { font-size: 20px; }
.check { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 12px; font-size: 15px; }
.check svg { width: 20px; height: 20px; margin-top: 2px; }
.check.ok { background: var(--teal-soft); } .check.ok svg { color: var(--teal); }
.check.warn { background: var(--warn-soft); } .check.warn svg { color: var(--warn); }
.check b { font-weight: 700; }

details.guide { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
details.guide summary {
  list-style: none; padding: 16px; display: grid; grid-template-columns: 40px 1fr 20px; gap: 12px; align-items: center; cursor: pointer;
}
details.guide summary::-webkit-details-marker { display: none; }
details.guide summary .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
details.guide summary .ico svg { width: 22px; height: 22px; }
details.guide summary h3 { font-size: 17px; }
details.guide summary small { display: block; color: var(--muted); font-size: 13px; font-family: var(--body); font-weight: 500; }
details.guide summary .chev { width: 20px; height: 20px; color: var(--muted); transition: transform .2s; }
details.guide[open] summary .chev { transform: rotate(180deg); }
details.guide .body { padding: 0 16px 16px 68px; display: grid; gap: 10px; color: var(--fg); font-size: 15px; }
details.guide .body ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
details.guide .body li::marker { color: var(--accent); }
@media (max-width: 380px) { details.guide .body { padding-left: 16px; } }

.challenge { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.done-badge { font-size: 13px; font-weight: 700; color: var(--teal); }

.empty { text-align: center; padding: 28px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.tabs .inner { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
nav.tabs button {
  border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 3px;
  font-size: 11px; font-weight: 600; color: var(--muted); min-width: 0;
}
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px;
  border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px);
}
.note { font-size: 13px; color: var(--muted); }
</style>
<!--APP-HEAD-END-->
</head>

<script>
(() => {
  "use strict";

  /* ---------- Contenido ---------- */
  const OPENERS = {
    apps: {
      label: "Apps de citas",
      items: [
        ["Tu foto en la montaña me ha dejado con una duda: ¿subiste por las vistas o por el bocadillo de arriba?", "Comenta un detalle concreto de su perfil. Demuestra que has mirado más allá de la primera foto."],
        ["Pregunta seria para filtrar desde el principio: ¿tortilla con cebolla o sin cebolla?", "Un debate ligero da pie a bromear y a defender posturas sin riesgo."],
        ["Veo que te gusta cocinar. ¿Cuál es el plato que te sale tan bien que lo usarías para impresionar a alguien?", "Pregunta abierta sobre algo que ya ha mencionado: le das el protagonismo."],
        ["Tengo que decirlo: tu perfil es de los pocos que dan ganas de seguir leyendo. ¿Lo de aprender a bucear va en serio?", "Halago sobre algo que ha elegido (lo que escribe), no sobre su físico, y pregunta para seguir."],
        ["Si tu perfil fuera una película, ¿de qué género sería? El mío sería comedia con algún giro inesperado.", "Le das una respuesta tuya de ejemplo, así es más fácil contestar."],
        ["Dos verdades y una mentira, versión rápida: he vivido en Lisboa, sé tocar el ukelele y nunca he visto Titanic. ¿Cuál es la falsa?", "Juego corto que invita a responder con el suyo."],
        ["Plan de domingo perfecto en tres palabras. Yo empiezo: churros, paseo, siesta.", "Respuesta fácil y concreta. Ya tienes una pista para una cita."],
        ["Me ha hecho gracia tu bio. Ahora necesito saber la historia detrás de esa foto con disfraz.", "Las fotos con historia son una invitación a preguntar."]
      ]
    },
    persona: {
      label: "En persona",
      items: [
        ["Perdona, tengo que preguntarlo: ¿qué estás leyendo? Llevo un rato intentando ver la portada.", "Contexto real y sincero. Si responde con una palabra y vuelve al libro, despídete con amabilidad."],
        ["Tienes pinta de saber qué se pide aquí. ¿Qué me recomiendas?", "Pedir una recomendación es natural y no presiona."],
        ["Hola, soy Álex. Te he visto antes y me he dicho que si no venía a saludarte me iba a arrepentir.", "Directo y honesto. Funciona mejor de lo que parece si lo dices con calma."],
        ["Esta canción está sonando demasiado alta para hablar, pero lo voy a intentar igual: ¿cómo te llamas?", "Usa el entorno para quitar hierro al momento."],
        ["Me ha encantado lo que has dicho antes sobre los viajes en tren. ¿Cuál ha sido el mejor?", "Retoma algo que ha dicho en grupo. Demuestra que escuchas."],
        ["No conozco a nadie aquí y tú pareces la persona más simpática del sitio. ¿Te importa si me uno?", "Reconocer tu situación te hace cercano."],
        ["¿Vienes mucho por aquí o también es tu primera vez y estás disimulando como yo?", "Humor sobre ti mismo. Baja la tensión de los dos."]
      ]
    },
    divertidas: {
      label: "Divertidas",
      items: [

        ["Necesito tu opinión urgente: ¿los perros deberían llevar pantalones en las dos patas o en las cuatro?", "Pregunta tonta que suele acabar en risas y en un buen intercambio."],
        ["Estoy formando un equipo para un apocalipsis zombi. ¿Qué habilidad aportas?", "Imaginativa. Permite que cada uno se luzca."],
        ["Dime tu peor talento oculto y yo te digo el mío.", "Vulnerabilidad con humor y en igualdad de condiciones."],

  /* Analizador de bio: reglas simples, sin enviar nada a ningún servidor */
  const CLICHES = ["me gusta viajar", "amante de los viajes", "pregúntame", "preguntame", "vive la vida", "buen rollo", "carpe diem", "netflix", "salir con amigos", "foodie", "disfrutar de la vida", "aventurer", "sin complicaciones", "lo que surja"];
  const NEGATIVE = ["no busco", "abstenerse", "si no te gusta", "nada de", "odio", "no quiero", "dramas", "desliza a la izquierda"];
  function analyzeBio(text) {
    const t = text.trim();
    const low = t.toLowerCase();
    const words = t ? t.split(/\s+/).length : 0;
    const emojis = (t.match(/\p{Extended_Pictographic}/gu) || []).length;
    const out = [];
    let score = 5;
    if (!t) return { score: 0, out: [{ ok: false, h: "Escribe tu bio", p: "Pega aquí el texto de tu perfil para analizarlo." }] };

    if (words < 12) { score -= 1; out.push({ ok: false, h: "Muy corta", p: `Tiene ${words} palabras. Con 25–80 das más temas para empezar a hablar.` }); }
    else if (words > 110) { score -= 1; out.push({ ok: false, h: "Algo larga", p: `Tiene ${words} palabras. Quédate con lo más tuyo y deja algo para la conversación.` }); }
    else { score += 1; out.push({ ok: true, h: "Buena longitud", p: `${words} palabras: suficiente para conocerte sin aburrir.` }); }

    const cl = CLICHES.filter((c) => low.includes(c));
    if (cl.length) { score -= Math.min(2, cl.length); out.push({ ok: false, h: "Frases muy vistas", p: `“${cl.join("”, “")}” aparece en miles de perfiles. Cambia “me gusta viajar” por “el mejor viaje que he hecho fue a…”.` }); }
    else { score += 1; out.push({ ok: true, h: "Sin tópicos", p: "No usas las frases que aparecen en todos los perfiles." }); }

    const ng = NEGATIVE.filter((c) => low.includes(c));
    if (ng.length) { score -= Math.min(2, ng.length); out.push({ ok: false, h: "Tono negativo", p: "Decir lo que no quieres echa para atrás. Cuenta lo que sí buscas: “busco a alguien con quien probar restaurantes nuevos”." }); }
    else { score += 1; out.push({ ok: true, h: "Tono positivo", p: "Hablas de lo que te gusta, no de lo que rechazas." }); }

    if (t.includes("?")) { score += 1; out.push({ ok: true, h: "Invita a responder", p: "Una pregunta en la bio da una forma fácil de escribirte." }); }
    else out.push({ ok: false, h: "Añade una pregunta o reto", p: "Termina con algo fácil de contestar: “¿Cuál es tu bar de tapas favorito?”." });

    const specific = /\d/.test(t) || /(?:^|[^.!?]\s)[A-ZÁÉÍÓÚÑ][a-záéíóúñ]{2,}/.test(t.slice(1));
    if (specific) { score += 1; out.push({ ok: true, h: "Detalles concretos", p: "Nombres, lugares o números hacen tu perfil memorable." }); }
    else out.push({ ok: false, h: "Sé más concreto", p: "Menciona un sitio, un libro, un plato o una cifra. Lo concreto se recuerda." });

    if (emojis > 4) { score -= 1; out.push({ ok: false, h: "Demasiados emojis", p: `Llevas ${emojis}. Con uno o dos basta para dar tono.` }); }

    return { score: Math.max(1, Math.min(10, score)), out };
  }
  function bioResult(text) {
    const { score, out } = analyzeBio(text);
    const C = 2 * Math.PI * 34;
    const verdict = score >= 8 ? ["Perfil con chispa", "Tu bio da ganas de escribirte."]
      : score >= 6 ? ["Vas bien", "Unos retoques y destacará."]
      : score > 0 ? ["Se puede mejorar", "Mira las sugerencias de abajo."]
      : ["Sin texto", "Escribe tu bio arriba."];
    return `
      <div class="score">
        <svg class="dial" viewBox="0 0 84 84" role="img" aria-label="Puntuación ${score} de 10">
          <circle class="trk" cx="42" cy="42" r="34" fill="none" stroke-width="9"/>
          <circle class="val" cx="42" cy="42" r="34" fill="none" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - score / 10)).toFixed(1)}" transform="rotate(-90 42 42)"/>
          <text x="42" y="46" text-anchor="middle">${score}</text>
          <text class="of" x="42" y="60" text-anchor="middle">de 10</text>
        </svg>
        <div class="verdict"><h3>${verdict[0]}</h3><p class="sub">${verdict[1]}</p></div>
      </div>
      <div class="list">${out.map((o) => `
        <div class="check ${o.ok ? "ok" : "warn"}">${icon(o.ok ? "i-check" : "i-alert")}<div><b>${esc(o.h)}.</b> ${esc(o.p)}</div></div>`).join("")}
      </div>`;
  }
  function viewBio() {
    const isSample = state.bio === SAMPLE_BIO;
    return `
      <section class="view">
        <div><p class="eyebrow">Revisor de perfil</p><h1 class="h-xl">¿Tu bio da ganas de escribirte?</h1></div>
        <div class="panel">
          <label class="field-label" for="bioText">${isSample ? "Bio de ejemplo. Bórrala y pega la tuya" : "Tu bio"}</label>
          <textarea id="bioText" spellcheck="true">${esc(state.bio)}</textarea>
          <div class="row">
            <button class="btn" type="button" data-act="clearbio">Borrar</button>
            <button class="btn" type="button" data-act="samplebio">Ver ejemplo</button>
          </div>
          <p class="note">El análisis se hace en tu móvil. Tu texto no se envía a ningún sitio.</p>
        </div>
        <div class="panel" id="bioOut">${bioResult(state.bio)}</div>
      </section>`;
  }

  function viewGuia() {
    return `
      <section class="view">
        <div><p class="eyebrow">Guía</p><h1 class="h-xl">Lo que conviene saber</h1></div>
        ${GUIDE.map((g, i) => `
          <details class="guide" ${i === 0 ? "open" : ""}>
            <summary>
              <span class="ico">${icon(g.ico)}</span>
              <span><h3>${esc(g.t)}</h3><small>${esc(g.s)}</small></span>
              <svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg>
            </summary>
            <div class="body">
              <p>${esc(g.body[0])}</p>
              <ul>${g.body[1].map((li) => `<li>${esc(li)}</li>`).join("")}</ul>
            </div>
          </details>`).join("")}
        <p class="note">Si te sientes en peligro en una cita, llama al 112.</p>
      </section>`;
  }

  const VIEWS = { hoy: viewHoy, frases: viewFrases, citas: viewCitas, bio: viewBio, guia: viewGuia };
  function render() {
    if (!VIEWS[state.tab]) state.tab = "hoy";
    $("#main").innerHTML = VIEWS[state.tab]();
    $("#streakN").textContent = state.doneDays.length;
  }

  /* ---------- Eventos ---------- */
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const d = b.dataset;
    if (d.tab) return go(d.tab);
    if (d.go) return go(d.go);
    if (d.copy) return copy(d.copy);
    if (d.cat) { state.cat = d.cat; state.idx = 0; store.set("cat", d.cat); return render(); }
    if (d.unfav) { toggleFav(d.unfav); return render(); }
    if (d.budget) { state.budget = d.budget; store.set("budget", d.budget); return render(); }
    if (d.when) { state.when = d.when; store.set("when", d.when); return render(); }
    if (d.first) { state.firstOnly = d.first === "1"; store.set("firstOnly", state.firstOnly); return render(); }
    switch (d.act) {
      case "next": {
        const len = OPENERS[state.cat].items.length;
        let n = state.idx;
        if (len > 1) while (n === state.idx) n = Math.floor(Math.random() * len);
        state.idx = n; return render();
      }
      case "copy": return copy(OPENERS[state.cat].items[state.idx][0]);
      case "fav": toggleFav(favKey(state.cat, state.idx)); return render();
      case "done":
        if (!state.doneDays.includes(today())) state.doneDays.push(today());
        store.set("doneDays", state.doneDays); toast("Reto completado"); return render();
      case "clearbio": state.bio = ""; store.set("bio", ""); render(); return $("#bioText").focus();
      case "samplebio": state.bio = SAMPLE_BIO; store.set("bio", SAMPLE_BIO); return render();
    }
  });
  document.addEventListener("input", (e) => {
    if (e.target.id !== "bioText") return;
    state.bio = e.target.value; store.set("bio", state.bio);
    $("#bioOut").innerHTML = bioResult(state.bio);
  });

  renderTabs();
  render();

  // Instalable y offline cuando se sirve como web normal (en vistas incrustadas se ignora)
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
<!--APP-END-->
</body>
</html>
